<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
  <div class="flex h-16 items-center justify-between px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">

    <div class="flex items-center gap-2 cursor-pointer" routerLink="/orders">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      <span class="hidden sm:block text-lg font-bold text-slate-900 tracking-tight">Pedidos</span>
    </div>

    <nav>
      <ul class="flex gap-2 items-center">
        <li>
          <a routerLink="/orders" [routerLinkActive]="['bg-indigo-50', 'text-indigo-700']"
            [routerLinkActiveOptions]="{exact: true}"
            class="px-4 py-2 rounded-md text-sm font-semibold text-slate-500 hover:text-slate-900 hover:bg-slate-50 transition-all block cursor-pointer">
            Pedidos
          </a>
        </li>
        <li>
          <a routerLink="/orders/new" [routerLinkActive]="['bg-indigo-50', 'text-indigo-700']"
            [routerLinkActiveOptions]="{exact: true}"
            class="px-4 py-2 rounded-md text-sm font-semibold text-slate-500 hover:text-slate-900 hover:bg-slate-50 transition-all block cursor-pointer">
            Novo Pedido
          </a>
        </li>
      </ul>
    </nav>

  </div>
</header>
