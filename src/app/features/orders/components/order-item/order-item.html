<div class="grid grid-cols-1 md:grid-cols-6 gap-3 md:gap-0 items-center p-5 md:p-4 md:px-6 
           bg-white md:bg-transparent rounded-xl md:rounded-none 
           border border-slate-200 md:border-0 md:border-b md:border-slate-100
           mb-4 md:mb-0 shadow-sm md:shadow-none
           hover:bg-slate-50 transition-colors duration-200">

  <div class="flex justify-between items-start md:block">
    <div class="flex flex-col">
      <span class="md:hidden text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">ID</span>
      <span class="text-sm font-bold text-slate-900 md:font-semibold">#{{ order()?.id }}</span>
    </div>

    <div class="md:hidden">
      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border-none"
        [class]="statusColor()">
        {{ order()?.status }}
      </span>
    </div>
  </div>

  <div class="flex flex-col md:block">
    <span class="md:hidden text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Cliente</span>
    <div class="flex items-center gap-2">
      <div
        class="hidden md:flex h-7 w-7 rounded-full bg-indigo-100 text-indigo-600 items-center justify-center text-xs font-bold">
        {{ order()?.customerName?.charAt(0) }}
      </div>
      <span class="text-sm font-medium text-slate-700">{{ order()?.customerName }}</span>
    </div>
  </div>

  <div class="grid grid-cols-2 md:contents gap-4">
    <div class="flex flex-col md:block">
      <span class="md:hidden text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Data</span>
      <span class="text-sm text-slate-600 flex items-center gap-1.5">
        {{ order()?.deliveryDate | date: 'dd MMM yyyy': undefined: 'pt-BR' }}
      </span>
    </div>

    <div class="flex flex-col md:block">
      <span class="md:hidden text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Produto</span>
      <span class="text-sm text-slate-600 truncate block md:pr-4 font-medium" [title]="order()?.product">
        {{ order()?.product }}
      </span>
    </div>
  </div>

  <div class="hidden md:flex flex-col">
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium border-none"
      [class]="statusColor()">
      <span class="w-1.5 h-1.5 rounded-full bg-current mr-1.5"></span>
      {{ order()?.status }}
    </span>
  </div>

  <div
    class="flex items-center justify-end gap-2 relative mt-2 md:mt-0 pt-3 md:pt-0 border-t border-slate-100 md:border-0">

    <button (click)="onDelete($event)"
      class="flex-1 md:flex-none flex justify-center items-center py-2.5 md:p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all cursor-pointer bg-slate-50 md:bg-transparent">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
      <span class="md:hidden ml-2 text-xs font-bold uppercase tracking-tight">Excluir</span>
    </button>

    <button #trigger="cdkOverlayOrigin" cdkOverlayOrigin (click)="onToggleDropdown($event)"
      class="flex-1 md:flex-none flex justify-center items-center py-2.5 md:p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all cursor-pointer bg-slate-50 md:bg-transparent">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
      </svg>
      <span class="md:hidden ml-2 text-xs font-bold uppercase tracking-tight">Status</span>
    </button>

    <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="trigger" [cdkConnectedOverlayOpen]="isOpen()"
      [cdkConnectedOverlayHasBackdrop]="true" cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="onToggleDropdown()" [cdkConnectedOverlayPositions]="[
    { originX: 'end', originY: 'bottom', overlayX: 'end', overlayY: 'top', offsetY: 8 },
    { originX: 'end', originY: 'top', overlayX: 'end', overlayY: 'bottom', offsetY: -8 }
  ]">

      <app-dropdown (closed)="onToggleDropdown()" (statusSelected)="onStatusSelected($event)">
      </app-dropdown>
    </ng-template>
  </div>
</div>
