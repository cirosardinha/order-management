<app-header />

<div class="flex flex-col items-center px-4 py-12 min-h-screen bg-slate-50">

  <h2 class="text-2xl font-bold mb-8 text-slate-900">Novo Pedido</h2>

  <form (submit)="onSubmit($event)"
    class="w-full max-w-lg bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-2">

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Cliente</mat-label>
      <input matInput placeholder="Nome do cliente" [formField]="orderForm.customerName" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Produto</mat-label>
      <input matInput placeholder="Nome do produto" [formField]="orderForm.product" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Data de Entrega</mat-label>
      <input matInput [matDatepicker]="picker" [formField]="orderForm.deliveryDate" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-hint>DD/MM/AAAA</mat-hint>
    </mat-form-field>

    <div class="mt-6">
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition-colors cursor-pointer shadow-md">
        Salvar Pedido
      </button>
    </div>

  </form>
</div>
