<app-header />

<div class="mx-4 flex flex-col items-center rounded-lg p-4 mt-4">
  <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">Novo Pedido</h2>
  <form (submit)="onSubmit($event)" class="flex flex-col gap-4 w-full max-w-xl rounded-lg p-8 bg-white shadow-sm">
    <mat-form-field appearance="outline">
      <mat-label>Cliente</mat-label>
      <input matInput placeholder="Nome do cliente" [formField]="orderForm.customerName" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Produto</mat-label>
      <input matInput placeholder="Nome do produto" [formField]="orderForm.product" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Data de Entrega</mat-label>
      <input matInput [matDatepicker]="picker" [formField]="orderForm.deliveryDate" />
      <mat-hint>DD/MM/AAAA</mat-hint>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="flex justify-end gap-4">
      <button type="submit" class="cursor-pointer" matButton="tonal">Salvar</button>
    </div>
  </form>


</div>
