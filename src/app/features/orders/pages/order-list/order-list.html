<app-header />

<main class="min-h-screen bg-slate-50">
  <div class="pt-10 pb-6 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Lista de Pedidos</h1>
  </div>

  <div class="px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto mb-12">
    <div class="bg-white rounded-xl shadow-sm ring-1 ring-slate-200 overflow-hidden">

      <div
        class="hidden md:grid grid-cols-6 px-6 py-4 border-b border-slate-200 bg-slate-50/80 text-xs font-semibold text-slate-500 uppercase tracking-wider">
        <div>ID</div>
        <div>Cliente</div>
        <div>Data</div>
        <div>Produto</div>
        <div>Status</div>
        <div class="text-right">Ações</div>
      </div>

      <div class="flex flex-col divide-y divide-slate-100 min-h-[40vh]">
        @for (order of orders(); track order.id) {
        <app-order-item [isOpen]="openDropdownId() === order.id" [order]="order" (orderDeleted)="onOrderDeleted($event)"
          (statusChanged)="onStatusChange($event)" (toggleDropdown)="toggleDropdown(order.id)" />
        } @empty {
        <div class="flex flex-col items-center justify-center py-20 text-center">
          <p class="text-slate-400 text-sm">Nenhum pedido registrado.</p>
        </div>
        }
      </div>
    </div>
  </div>
</main>
