<app-header />

<div class="flex flex-col gap-2 mb-6">
  <h1 class="text-3xl font-bold text-gray-800 mx-4">Lista de Pedidos</h1>
  <p class="text-gray-500 mx-4">Gerencie seus pedidos</p>
</div>

<div class="hidden md:grid grid-cols-5 px-6 py-2 text-sm text-gray-500 font-semibold bg-gray-200 mx-4">
  <div>ID</div>
  <div>Cliente</div>
  <div>Data</div>
  <div>Produto</div>
  <div>Status</div>
</div>

<div class="md:hidden mx-4 mb-2 text-sm text-gray-500 font-semibold">
  Pedidos
</div>

<div
  class="flex flex-col gap-3 border border-gray-100 rounded-lg px-4 py-2 shadow-sm mx-4 overflow-y-auto min-h-[60vh] md:h-98 max-h-98 bg-white">
  @for (order of orders(); track order.id) {
  <app-order-item (orderDeleted)="onOrderDeleted($event)" (statusChanged)="onStatusChange($event)" [order]="order" />
  } @empty {
  <div class="text-center py-4 text-gray-500">
    Nenhum pedido encontrado
  </div>

  <div class="text-center">
    <a routerLink="/orders/new" class="bg-[#dae2f9] text-gray-600 px-4 py-2 rounded-lg font-medium inline-block">
      Cadastrar novo pedido
    </a>
  </div>
  }
</div>
